databases:
  - name: a3-analytics-db
    plan: free

services:
  - type: web
    name: a3-analytics-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: a3-analytics-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: MOCK_AI
        value: "True"
